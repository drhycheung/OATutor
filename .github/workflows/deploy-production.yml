name: Production CI

on:
  push:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  buildAndDeploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Initialise content submodule (HTTPS, public repo)
        run: git submodule update --init --recursive

      - name: Save original git author and git email
        run: |
          echo "git_email=$(git log --format='%ae' HEAD^!)" >> $GITHUB_ENV
          echo "git_name=$(git log --format='%an' HEAD^!)" >> $GITHUB_ENV

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Create placeholder Firebase config
        run: |
          cat > src/config/firebaseConfig.js << 'EOF'
          export default null;
          EOF

      - name: Run build
        run: npm run build
        env:
          CI: false
          REACT_APP_BUILD_TYPE: "production"
          REACT_APP_COMMIT_HASH: ${{ github.sha }}

      - name: Deploy to gh-pages
        run: |
          cd $RUNNER_TEMP
          git clone --branch gh-pages https://github.com/${{ github.repository }} gh-build || mkdir -p gh-build && cd gh-build && git init
          cd gh-build
          git config --local user.email "${{ env.git_email }}"
          git config --local user.name "${{ env.git_name }}"
          git rm -rf . 2>/dev/null || true
          rsync -av $GITHUB_WORKSPACE/build/ .
          touch .nojekyll
          git add .
          git diff --cached --quiet --exit-code && echo "no changes, exiting early" && exit 0
          git commit -m "deploy: ${{ github.sha }}"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} gh-pages
